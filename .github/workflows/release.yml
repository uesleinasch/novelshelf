name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Tag must be on production
        run: |
          git fetch origin production
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/production; then
            echo "::error::Tag $GITHUB_REF_NAME nao esta na branch production"
            exit 1
          fi

      - name: Tag must match Directory.Build.props version
        run: |
          expected="v$(grep -oP '(?<=<Version>)[^<]+' Directory.Build.props)"
          if [ "$expected" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME diferente da versao do Directory.Build.props ($expected)"
            exit 1
          fi

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet test -c Release

      - name: Publish Linux and Windows builds
        run: |
          for rid in linux-x64 win-x64; do
            dotnet publish src/NovelShelf.App -c Release -r "$rid" --self-contained \
              -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true \
              -o "out/NovelShelf-$GITHUB_REF_NAME-$rid"
          done
          cd out
          tar -czf "NovelShelf-$GITHUB_REF_NAME-linux-x64.tar.gz" "NovelShelf-$GITHUB_REF_NAME-linux-x64"
          zip -qr "NovelShelf-$GITHUB_REF_NAME-win-x64.zip" "NovelShelf-$GITHUB_REF_NAME-win-x64"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" out/*.tar.gz out/*.zip --generate-notes --title "NovelShelf $GITHUB_REF_NAME"
